<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수행평가 스티커북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 모눈 공책 위에 과목별 스티커 카드, 항목을 누르면 아래에서 올라오는 준비 노트 */
:root{
  --paper:#FBF8FF; --grid:#ECE6F8; --card:#FFFFFF; --ink:#3B3553; --soft:#7A7294; --line:#E4DDF2;
  --pink:#FF8FB1; --mint:#5CCDAE; --butter:#FFD45E; --sky:#7DB8FF; --lilac:#B49BFF; --peach:#FFA77D;
  --pinkbg:#FFE8F0; --mintbg:#DDF6EE; --butterbg:#FFF5D6; --skybg:#E3F0FF; --lilacbg:#EEE8FF; --peachbg:#FFEDE3;
  --done:#5CCDAE; --shadow:0 3px 0 #E4DDF2;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E1B2E; --grid:#282440; --card:#2A2640; --ink:#F1ECFF; --soft:#A9A1C6; --line:#3A3456;
  --pinkbg:#4A2A3C; --mintbg:#1F4038; --butterbg:#463C1F; --skybg:#22344F; --lilacbg:#352C55; --peachbg:#48301F;
  --shadow:0 3px 0 #15121F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1E1B2E; --grid:#282440; --card:#2A2640; --ink:#F1ECFF; --soft:#A9A1C6; --line:#3A3456;
  --pinkbg:#4A2A3C; --mintbg:#1F4038; --butterbg:#463C1F; --skybg:#22344F; --lilacbg:#352C55; --peachbg:#48301F;
  --shadow:0 3px 0 #15121F; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.6;
}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

/* header */
.top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.hello{font-size:13px;color:var(--soft);letter-spacing:.06em}
h1{font-size:clamp(30px,6vw,44px);line-height:1.15;margin-top:4px}
h1 .tape{background:linear-gradient(transparent 55%,var(--butterbg) 55%);padding:0 4px}
.dday{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:8px 14px;text-align:center;box-shadow:4px 4px 0 var(--pink);transform:rotate(2deg)}
.dday b{display:block;font-family:var(--display);font-size:26px;font-weight:400;line-height:1.1}
.dday span{font-size:12px;color:var(--soft)}

.board{margin-top:20px;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:10px}
.board-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.board h2{font-size:20px}
.board .cnt{font-variant-numeric:tabular-nums;color:var(--soft)}
.shelf{display:flex;flex-wrap:wrap;gap:4px;min-height:30px}
.shelf svg{width:26px;height:26px}
.shelf .empty{width:26px;height:26px;border:2px dashed var(--line);border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* subject cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.subj{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.subj-head{padding:14px 16px 10px;background:var(--tint);display:flex;justify-content:space-between;align-items:center;gap:10px}
.subj-head h3{font-size:21px}
.subj-head .tag{font-size:12px;background:var(--card);border-radius:999px;padding:2px 10px;white-space:nowrap}
.bar{height:8px;background:var(--card);border-radius:99px;margin:0 16px 0;overflow:hidden}
.subj-head + .barbox{background:var(--tint);padding-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.items{list-style:none;margin:0;padding:6px 8px 10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:9px 8px}
.item:hover{background:var(--paper)}
.item .nm{min-width:0}
.item .nm b{font-weight:400;display:block}
.item .nm small{color:var(--soft);font-size:12px}
.pct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--soft)}
.dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.dot.s1{border:2px solid var(--accent);background:var(--tint)}
.dot.s1::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.s2{border:0}
.dot svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,20,50,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--paper);
  border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(30,20,50,.2);
  padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.sheet{left:50%;width:720px;transform:translateX(-50%);bottom:24px;border-radius:24px;max-height:calc(100vh - 48px)}}
.sheet-in{max-width:680px;margin:0 auto}
.sheet-top{position:sticky;top:0;background:var(--paper);padding:14px 0 10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}
.sheet-top .sub{font-size:13px;color:var(--soft)}
.sheet-top h2{font-size:24px;line-height:1.25}
.x{border:2px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;flex:none;font-size:18px;line-height:1}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.status button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.status button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.box{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.box h3{font-size:17px;margin-bottom:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;cursor:pointer;padding:4px 0}
.steps input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:1px 0 0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.steps input:checked{background:var(--accent);border-color:var(--accent)}
.steps input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.steps input:checked + span{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--accent)}
.tip{background:var(--butterbg);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tip b{font-family:var(--display);font-weight:400;margin-right:6px}
.note-sec{display:grid;gap:4px;margin-top:12px}
.note-sec label{font-family:var(--display);font-size:15px}
.note-sec small{color:var(--soft);font-size:12px}
textarea{width:100%;min-height:92px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;line-height:1.7;
  background-image:linear-gradient(transparent 26px,var(--line) 27px);background-size:100% 27px;background-attachment:local}
.wc{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:10px;font-variant-numeric:tabular-nums}
.saved{color:var(--mint)}
.foot{margin-top:28px;font-size:12px;color:var(--soft);text-align:center}
.cheer{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:40;pointer-events:none;transition:all .35s}
.cheer.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cheer svg{width:120px;height:120px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.top{grid-template-columns:1fr}.dday{justify-self:start;transform:rotate(-1.5deg)}}

/* modes + mock exam */
.modes{display:flex;gap:6px;margin-top:22px;background:var(--card);padding:5px;border-radius:999px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.modes button{border:0;background:none;border-radius:999px;padding:8px 18px;font-family:var(--display);font-size:16px;color:var(--soft)}
.modes button[aria-selected="true"]{background:var(--pink);color:#fff}
.exam-note{margin:18px 0 14px;font-size:13px;color:var(--soft);background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px 14px}
.ecard{display:grid;gap:8px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:16px;box-shadow:var(--shadow);border-top:8px solid var(--accent);min-width:0}
.ecard:hover{transform:translateY(-2px)}
.ecard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ecard h3{font-size:22px}
.ecard .range{font-size:13px;color:var(--soft)}
.ecard .meta{font-size:12px;background:var(--tint);border-radius:999px;padding:3px 10px;width:fit-content}
.stamp{font-family:var(--display);font-size:18px;color:var(--accent);border:3px solid var(--accent);border-radius:12px;padding:0 10px;transform:rotate(-6deg);font-variant-numeric:tabular-nums}
.ecard .tag{font-size:12px;color:var(--soft)}
.scorebar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;background:var(--tint);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.scorebar b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.scorebar span{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.passage{background:var(--card);border-left:5px solid var(--accent);border-radius:6px 14px 14px 6px;padding:12px 16px;margin:6px 0 12px;white-space:pre-line;font-size:14.5px;line-height:1.8}
.passage small{display:block;color:var(--soft);font-size:12px;margin-bottom:4px}
.q{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.q.ok{box-shadow:0 0 0 2px var(--mint)}
.q.no{box-shadow:0 0 0 2px var(--pink)}
.qh{margin-bottom:10px;white-space:pre-line}
.qh b{font-family:var(--display);font-weight:400;font-size:17px;margin-right:4px}
.pt{font-size:12px;color:var(--soft);white-space:nowrap}
.chs{display:grid;gap:6px}
.chs button{display:grid;grid-template-columns:28px 1fr;gap:6px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 10px;align-items:start}
.chs button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.chs button.right{border-color:var(--mint);background:var(--mintbg)}
.chs button.wrong{border-color:var(--pink);background:var(--pinkbg);text-decoration:line-through}
.chs button:disabled{cursor:default;color:var(--ink)}
.ex{margin-top:10px;font-size:13.5px;background:var(--paper);border-radius:12px;padding:8px 12px}
.ex b{font-family:var(--display);font-weight:400}
.model{margin-top:10px;font-size:14px;background:var(--mintbg);border-radius:12px;padding:10px 14px;white-space:pre-line}
.crit{margin:8px 0 0;padding-left:18px;font-size:13px}
.selfg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:13px}
.selfg button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px}
.selfg button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions span{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.big{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 22px;font-family:var(--display);font-size:17px;box-shadow:3px 3px 0 var(--accent)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="hello">세종중 1학년 · 2학기</div>
      <h1><span class="tape">수행평가</span> 스티커북</h1>
    </div>
    <div class="dday" aria-live="polite"><span>정기시험 12.8(화)</span><b id="dday">D-?</b></div>
  </header>

  <section class="board" aria-label="모은 스티커">
    <div class="board-row"><h2>모은 스티커</h2><span class="cnt" id="cnt"></span></div>
    <div class="shelf" id="shelf"></div>
    <div class="legend"><span><i style="background:var(--line)"></i>시작 전</span><span><i style="background:var(--lilac)"></i>준비 중</span><span><i style="background:var(--mint)"></i>제출 완료 = 스티커!</span></div>
  </section>

  <div class="modes" role="tablist" aria-label="보기 선택">
    <button role="tab" id="tab-task" data-mode="task" aria-selected="true">수행평가 체크</button>
    <button role="tab" id="tab-exam" data-mode="exam" aria-selected="false">모의시험</button>
  </div>
  <div id="taskView">
    <nav class="chips" id="chips" aria-label="과목 고르기"></nav>
    <main class="grid" id="grid"></main>
  </div>
  <div id="examView" hidden></div>
  <p class="foot">체크한 내용, 쓴 글, 시험 답안은 이 기기(브라우저)에만 저장돼요. 다른 폰이나 컴퓨터에서는 보이지 않아요.</p>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" hidden></div>
<div class="cheer" id="cheer" aria-hidden="true"></div>

<script>
/* 모의시험 1회 — 예상 범위 기반 연습 문제. 지문은 연습용으로 새로 쓴 글. 선택형 9문항(각 10점) + 서술형 1문항(10점) */
const EXAM1=[
{k:'국어',c:'pink',st:'heart',range:'예상 범위: 주장하는 글, 비유·감각 표현, 품사',
 P:{A:'요즘 많은 청소년이 잠들기 직전까지 스마트폰을 본다. 그러나 우리는 잠자리에서 스마트폰 사용을 줄여야 한다. ㉠ 한 연구에 따르면 잠들기 전 1시간 동안 화면을 본 학생은 그렇지 않은 학생보다 잠드는 데 평균 20분이 더 걸렸다. 또한 밤늦게까지 이어지는 메시지 알림은 깊은 잠을 방해한다.\n㉡ 물론 스마트폰으로 하루를 정리하며 쉬는 것도 필요하다는 의견이 있다. 하지만 휴식은 책 읽기나 가벼운 스트레칭으로도 충분히 할 수 있다.'},
 qs:[
 {p:'A',q:'윗글에서 글쓴이가 내세우는 주장으로 알맞은 것은?',ch:['청소년은 책을 더 많이 읽어야 한다.','잠자리에서 스마트폰 사용을 줄여야 한다.','메시지 알림 기능을 없애야 한다.','잠들기 전에 반드시 스트레칭을 해야 한다.','스마트폰으로 하루를 정리하는 것이 좋다.'],a:1,ex:'둘째 문장 "우리는 잠자리에서 스마트폰 사용을 줄여야 한다"가 주장이에요. 나머지는 근거나 반박에 쓰인 내용이에요.'},
 {p:'A',q:'㉠에서 사용한 근거의 종류로 가장 알맞은 것은?',ch:['글쓴이의 개인 경험','속담이나 격언','연구 결과와 수치','전문가와의 면담','비유를 이용한 설명'],a:2,ex:'"한 연구에 따르면 … 평균 20분"처럼 연구 결과와 수치를 근거로 들었어요.'},
 {p:'A',q:'㉡ 문단의 역할로 가장 알맞은 것은?',ch:['문제 상황을 처음 소개한다.','글쓴이의 주장을 처음 밝힌다.','예상되는 반론을 제시하고 반박한다.','앞의 근거를 다시 요약한다.','새로운 주제로 화제를 바꾼다.'],a:2,ex:'"물론 ~라는 의견이 있다. 하지만 ~"은 반론을 받아들이는 척하며 반박하는 전형적인 구조예요.'},
 {q:'주장하는 글의 근거를 점검할 때 확인할 내용으로 알맞지 않은 것은?',ch:['근거가 주장과 관련이 있는가?','근거의 출처를 믿을 수 있는가?','자료가 너무 오래되지 않았는가?','근거가 화려하고 긴 표현으로 쓰였는가?','근거가 사실에 바탕을 두었는가?'],a:3,ex:'근거는 타당성(관련성)과 신뢰성(출처, 사실, 최신성)으로 점검해요. 표현이 화려한지는 기준이 아니에요.'},
 {q:'"내 마음은 호수요"에 쓰인 표현 방법은?',ch:['직유법','은유법','의인법','과장법','반복법'],a:1,ex:'"~처럼, ~같이" 없이 "A는 B이다"로 빗대었으니 은유법이에요.'},
 {q:'다음 중 사람이 아닌 대상을 사람처럼 표현한 문장은?',ch:['그의 손은 얼음처럼 차가웠다.','바람이 창문을 똑똑 두드린다.','하늘이 무너질 듯 비가 쏟아졌다.','산 넘어 산, 고개 넘어 고개.','시간은 금이다.'],a:1,ex:'바람이 사람처럼 창문을 "두드린다"고 했으니 의인법이에요. ①은 직유, ③은 과장, ⑤는 은유예요.'},
 {q:'다음 중 정서를 가장 구체적이고 생생하게 표현한 문장은?',ch:['합격 소식을 듣고 기뻤다.','합격 소식을 듣고 정말 좋았다.','합격 소식에 심장이 쿵쾅거려 휴대폰을 쥔 손이 떨렸다.','합격 소식을 들었다.','합격해서 행복한 하루였다.'],a:2,ex:'몸의 반응과 장면을 그려 감정을 보여 주는 문장이 가장 생생해요.'},
 {q:'"우와, 저 새 신발 정말 예쁘다!"에서 \'새\'의 품사는?',ch:['명사','관형사','형용사','부사','감탄사'],a:1,ex:'\'새\'는 뒤의 체언 \'신발\'을 꾸미고 모양이 바뀌지 않으니 관형사예요. (\'우와\'는 감탄사, \'정말\'은 부사, \'예쁘다\'는 형용사)'},
 {q:'다음 중 품사가 나머지와 다른 하나는?',ch:['달리다','먹다','예쁘다','읽다','웃다'],a:2,ex:'\'예쁘다\'는 성질·상태를 나타내는 형용사, 나머지는 동작을 나타내는 동사예요.'}
 ],
 essay:{q:'윗글의 ㉡처럼 "반론 + 반박" 구조를 이용하여, \'학교에서 수업 시간에는 휴대폰을 걷어야 한다\'는 주장에 대한 예상 반론과 그에 대한 반박을 각각 한 문장으로 쓰시오.',model:'반론: 갑자기 급한 일이 생기면 가족과 연락할 수 없다는 의견이 있다.\n반박: 하지만 급한 일은 교무실 전화나 담임 선생님을 통해 충분히 연락할 수 있다.',crit:['주장에 맞서는 반론을 알맞게 썼다 (5점)','반론에 직접 대응하는 반박을 썼다 (5점)']}},

{k:'사회',c:'sky',st:'cloud',range:'예상 범위: 민주주의의 발전, 정치 과정과 참여, 미디어',
 P:{B:'[신문 기사의 일부]\nㄱ. 시는 지난달 시청 옆에 새 도서관을 열었다.\nㄴ. 개관 첫 주 방문객은 약 3천 명이었다.\nㄷ. 이 도서관은 시민 모두가 반드시 가 봐야 할 최고의 공간이다.\nㄹ. 도서관은 평일 오후 9시까지 운영한다.'},
 qs:[
 {q:'고대 아테네 민주 정치에 대한 설명으로 옳은 것은?',ch:['모든 주민이 정치에 참여하였다.','시민이 민회에 모여 나랏일을 직접 결정하였다.','대표를 뽑아 의회에서 결정하는 방식이었다.','여성에게도 참정권이 보장되었다.','국왕이 모든 일을 최종 결정하였다.'],a:1,ex:'아테네는 시민이 민회에서 직접 결정한 직접 민주 정치였어요. 다만 여성, 노예, 외국인은 시민에서 제외되었어요.'},
 {q:'다음 중 근대 시민 혁명에 해당하지 않는 것은?',ch:['영국 명예혁명','미국 독립 혁명','프랑스 혁명','산업 혁명'],a:3,ex:'산업 혁명은 기계 발명으로 생산 방식이 바뀐 경제·사회 변화예요. 시민 혁명이 아니에요.'},
 {q:'차티스트 운동과 여성 참정권 운동의 공통된 목적으로 알맞은 것은?',ch:['국왕의 권력 강화','참정권의 확대','세금 인상','식민지 확대','종교의 자유'],a:1,ex:'노동자와 여성도 선거권을 갖게 하려는 운동으로, 보통 선거 실현에 이바지했어요.'},
 {q:'민주주의가 추구하는 근본이념은?',ch:['국민 주권','인간의 존엄성','권력 분립','입헌주의','다수결'],a:1,ex:'민주주의의 근본이념은 인간의 존엄성이고, 이를 실현하는 수단으로 자유와 평등을 보장해요. 나머지는 민주 정치의 원리예요.'},
 {q:'민주 정치의 원리와 설명을 바르게 연결한 것은?',ch:['국민 주권 - 헌법에 따라 나라를 다스린다.','입헌주의 - 국가의 최고 권력은 국민에게 있다.','권력 분립 - 국가 권력을 나누어 서로 견제하게 한다.','국민 자치 - 왕이 국민을 대신해 다스린다.','다수결 - 소수의 의견만 따른다.'],a:2,ex:'권력 분립은 입법·행정·사법으로 권력을 나누어 견제와 균형을 이루게 하는 원리예요. ①과 ②는 설명이 서로 바뀌었어요.'},
 {q:'"유권자 한 사람에게 똑같이 한 표씩, 같은 가치를 준다"는 선거의 원칙은?',ch:['보통 선거','평등 선거','직접 선거','비밀 선거'],a:1,ex:'투표의 수와 가치를 똑같이 하는 것은 평등 선거예요. 일정 나이 이상 누구나 투표하는 것은 보통 선거예요.'},
 {q:'정권을 얻는 것을 목적으로 사람들이 모여 만든 집단은?',ch:['정당','이익 집단','시민 단체','언론','법원'],a:0,ex:'정당은 정권 획득을 목표로 해요. 이익 집단은 자기 집단의 이익, 시민 단체는 공익을 추구해요.'},
 {p:'B',q:'위 기사에서 기자의 \'의견\'에 해당하는 문장은?',ch:['ㄱ','ㄴ','ㄷ','ㄹ'],a:2,ex:'"반드시 가 봐야 할 최고의 공간"은 확인할 수 있는 사실이 아니라 판단이 담긴 의견이에요.'},
 {q:'미디어 정보를 받아들이는 태도로 바람직하지 않은 것은?',ch:['정보의 출처와 작성 날짜를 확인한다.','같은 사건을 다룬 여러 매체를 비교한다.','사실과 의견을 구분하며 읽는다.','조회 수가 많은 정보는 사실이므로 바로 공유한다.','제목과 본문 내용이 일치하는지 살핀다.'],a:3,ex:'조회 수와 사실 여부는 관계가 없어요. 확인 없이 공유하면 가짜 뉴스를 퍼뜨릴 수 있어요.'}
 ],
 essay:{q:'고대 아테네 민주 정치와 오늘날 민주 정치의 차이점을 ① 참여 방식 ② 참여할 수 있는 사람의 범위 두 가지 측면에서 서술하시오.',model:'① 아테네는 시민이 민회에서 직접 결정하는 직접 민주 정치였지만, 오늘날은 대표를 뽑아 맡기는 대의 민주 정치가 중심이다.\n② 아테네에서는 성인 남성 시민만 참여했고 여성·노예·외국인은 제외되었지만, 오늘날은 보통 선거로 일정 나이 이상의 모든 국민이 참정권을 가진다.',crit:['참여 방식 차이(직접 ↔ 대의)를 썼다 (5점)','참여 범위 차이(제한 ↔ 보통 선거)를 썼다 (5점)']}},

{k:'수학',c:'lilac',st:'star',range:'예상 범위: 좌표평면과 그래프(정비례·반비례), 기본 도형과 작도, 평면·입체도형',
 qs:[
 {q:'좌표평면에서 점 (−3, 2)는 제몇 사분면 위의 점인가?',ch:['제1사분면','제2사분면','제3사분면','제4사분면','어느 사분면에도 속하지 않는다'],a:1,ex:'x좌표는 음수, y좌표는 양수이므로 제2사분면이에요.'},
 {q:'y가 x에 정비례하고 x = 3일 때 y = −12이다. x = −2일 때 y의 값은?',ch:['−8','−6','6','8','12'],a:3,ex:'y = ax에 대입하면 −12 = 3a, a = −4. 따라서 y = −4 × (−2) = 8이에요.'},
 {q:'y가 x에 반비례하고 x = 2일 때 y = 6이다. x = 4일 때 y의 값은?',ch:['1.5','3','6','12','24'],a:1,ex:'y = a/x에서 a = xy = 2 × 6 = 12. 따라서 y = 12/4 = 3이에요.'},
 {q:'정비례 관계 y = ax (a ≠ 0)의 그래프에 대한 설명으로 옳지 않은 것은?',ch:['원점을 지나는 직선이다.','a > 0이면 제1사분면과 제3사분면을 지난다.','a < 0이면 x의 값이 증가할 때 y의 값은 감소한다.','a의 절댓값이 클수록 y축에 가까워진다.','a < 0이면 제1사분면과 제3사분면을 지난다.'],a:4,ex:'a < 0이면 제2사분면과 제4사분면을 지나요.'},
 {q:'두 직선이 한 점에서 만나 생긴 맞꼭지각의 크기가 각각 (3x + 10)°, (x + 50)°일 때 x의 값은?',ch:['10','15','20','25','30'],a:2,ex:'맞꼭지각은 크기가 같아요. 3x + 10 = x + 50 → 2x = 40 → x = 20.'},
 {q:'다음 중 삼각형 ABC가 하나로 정해지지 않는 것은?',ch:['AB = 3cm, BC = 4cm, CA = 5cm','AB = 4cm, BC = 5cm, ∠B = 60°','BC = 6cm, ∠B = 40°, ∠C = 70°','∠A = 50°, ∠B = 60°, ∠C = 70°'],a:3,ex:'세 각의 크기만 주어지면 모양은 같고 크기가 다른 삼각형이 무수히 많아요.'},
 {q:'정팔각형의 한 내각의 크기는?',ch:['120°','135°','140°','144°','150°'],a:1,ex:'내각의 합 = 180° × (8 − 2) = 1080°, 한 내각 = 1080° ÷ 8 = 135°.'},
 {q:'다음 중 회전체가 아닌 것은?',ch:['원기둥','원뿔','구','원뿔대','삼각기둥'],a:4,ex:'회전체는 평면도형을 한 직선을 축으로 회전시켜 만든 입체예요. 삼각기둥은 다면체예요.'},
 {q:'밑면의 반지름이 3cm, 높이가 5cm인 원기둥의 부피는?',ch:['15π cm³','30π cm³','45π cm³','48π cm³','90π cm³'],a:2,ex:'부피 = π × 3² × 5 = 45π cm³.'}
 ],
 essay:{q:'밑면의 반지름이 3cm, 높이가 4cm, 모선의 길이가 5cm인 원뿔의 부피와 겉넓이를 풀이 과정과 함께 구하시오.',model:'부피 = ⅓ × π × 3² × 4 = 12π (cm³)\n겉넓이 = 밑넓이 + 옆넓이 = π × 3² + π × 3 × 5 = 9π + 15π = 24π (cm²)',crit:['부피 식과 답(12π cm³) (5점)','겉넓이 식과 답(24π cm²) (5점)']}},

{k:'과학',c:'mint',st:'flower',range:'예상 범위: 기체의 성질(입자 운동, 압력, 보일·샤를 법칙), 태양계',
 qs:[
 {q:'방 한쪽에 뿌린 향수 냄새가 방 전체로 퍼지는 까닭으로 가장 알맞은 것은?',ch:['향수 입자의 크기가 커지기 때문','향수 입자가 끊임없이 스스로 움직이기 때문','향수 입자의 수가 늘어나기 때문','공기 입자가 사라지기 때문','향수 입자가 멈춰 있기 때문'],a:1,ex:'입자가 스스로 끊임없이 운동하여 퍼져 나가는 현상을 확산이라고 해요.'},
 {q:'기체의 압력이 생기는 까닭은?',ch:['기체 입자가 서로 붙어 있기 때문','기체 입자가 용기 벽에 충돌하기 때문','기체 입자의 크기가 변하기 때문','기체 입자가 무거워지기 때문','기체 입자가 움직이지 않기 때문'],a:1,ex:'운동하는 기체 입자가 용기 벽에 부딪치며 힘을 가해 압력이 생겨요.'},
 {q:'온도가 일정할 때, 1기압에서 부피가 60mL인 기체에 3기압의 압력을 가하면 부피는 몇 mL가 되는가?',ch:['10mL','20mL','30mL','60mL','180mL'],a:1,ex:'보일 법칙: 압력 × 부피 = 일정. 1 × 60 = 3 × V → V = 20mL.'},
 {q:'다음 중 보일 법칙으로 설명할 수 있는 현상은?',ch:['찌그러진 탁구공을 뜨거운 물에 넣으면 펴진다.','여름철에 자동차 타이어가 팽팽해진다.','높은 산에 올라가면 과자 봉지가 부풀어 오른다.','열기구 속 공기를 가열하면 열기구가 떠오른다.','추운 겨울 바깥에 둔 풍선이 쪼그라든다.'],a:2,ex:'높은 곳은 바깥 압력이 낮아 봉지 속 기체의 부피가 커져요(보일 법칙). 나머지는 온도 변화에 따른 샤를 법칙이에요.'},
 {q:'압력이 일정할 때 기체의 온도를 높이면 나타나는 변화로 옳은 것은?',ch:['입자의 수가 늘어난다.','입자 하나의 크기가 커진다.','입자 운동이 활발해지고 입자 사이 거리가 멀어진다.','입자의 질량이 늘어난다.','입자 운동이 느려진다.'],a:2,ex:'샤를 법칙: 온도가 높아지면 입자 운동이 활발해져 부피가 커져요. 입자의 수, 크기, 질량은 그대로예요.'},
 {q:'목성형 행성의 특징으로 옳은 것은?',ch:['반지름과 질량이 작다.','단단한 암석 표면이 있다.','위성이 없거나 적다.','고리가 있고 위성이 많다.','평균 밀도가 크다.'],a:3,ex:'목성형 행성(목성, 토성, 천왕성, 해왕성)은 크고, 밀도가 작으며, 고리와 많은 위성을 가져요.'},
 {q:'태양계에서 가장 크고, 표면에 거대한 소용돌이인 대적점이 있는 행성은?',ch:['수성','화성','목성','토성','해왕성'],a:2,ex:'목성은 태양계에서 가장 큰 행성이고 대적점이 있어요.'},
 {q:'두꺼운 이산화 탄소 대기로 온실 효과가 커서 표면 온도가 태양계 행성 중 가장 높은 행성은?',ch:['수성','금성','지구','화성','천왕성'],a:1,ex:'태양에 가장 가까운 것은 수성이지만, 표면 온도가 가장 높은 행성은 금성이에요.'},
 {q:'태양 표면의 흑점이 검게 보이는 까닭은?',ch:['주변보다 온도가 낮기 때문','주변보다 온도가 높기 때문','구멍이 뚫려 있기 때문','달의 그림자이기 때문','빛을 전혀 내지 않기 때문'],a:0,ex:'흑점은 주변보다 온도가 낮아 상대적으로 어둡게 보여요.'}

 {q:'오늘날 대부분의 나라가 대의 민주 정치를 하는 까닭으로 가장 알맞은 것은?',ch:['국민이 정치에 관심이 없어서','인구가 많고 영토가 넓어 모든 국민이 한곳에 모이기 어려워서','왕이 대표를 정해 주어서','법으로 직접 참여를 금지해서','투표가 비용이 들지 않아서'],a:1,ex:'현대 국가는 규모가 커서 모두가 직접 모이기 어려워 대표를 뽑아 정치를 맡겨요.'},
 {q:'민주주의의 이념 중 \'평등\'의 의미로 알맞은 것은?',ch:['모든 사람이 똑같은 재산을 가져야 한다.','성별, 신분, 재산 등을 이유로 부당하게 차별받지 않는다.','다수의 의견만 따른다.','국가의 간섭 없이 마음대로 행동한다.','능력과 관계없이 같은 결과를 받는다.'],a:1,ex:'평등은 부당한 차별을 받지 않고 같은 조건과 기회를 보장받는 것이에요.'},
 {q:'국민 주권의 원리가 드러난 사례로 가장 알맞은 것은?',ch:['국민이 선거로 대표를 뽑는다.','법원이 다른 기관의 간섭 없이 재판한다.','정부가 헌법에 따라 정책을 집행한다.','국회와 정부가 서로 견제한다.','판사가 법에 따라 판결한다.'],a:0,ex:'나라의 주인인 국민이 선거로 대표를 뽑는 것이 국민 주권이에요. ②④는 권력 분립, ③은 입헌주의와 관련돼요.'},
 {q:'투표소의 기표소에 가림막을 설치하는 것과 관련 깊은 선거의 원칙은?',ch:['보통 선거','평등 선거','직접 선거','비밀 선거'],a:3,ex:'누구에게 투표했는지 다른 사람이 알 수 없게 하는 것은 비밀 선거예요.'},
 {q:'환경 보호, 인권 보장 등 사회 전체의 이익(공익)을 위해 시민들이 자발적으로 만든 단체는?',ch:['정당','이익 집단','시민 단체','언론','정부'],a:2,ex:'시민 단체는 공익을 추구해요. 이익 집단은 자기 집단의 특수한 이익을 추구해요.'},
 {q:'정치 과정에서 시민의 요구를 받아들여 정책을 결정하는 주체로 가장 알맞은 것은?',ch:['언론','국회와 정부','이익 집단','시민 단체','개인'],a:1,ex:'시민·이익 집단·언론 등이 요구를 표출하면, 정책 결정은 국회와 정부가 맡아요.'},
 {q:'가짜 뉴스를 가려내는 방법으로 알맞지 않은 것은?',ch:['기사를 쓴 사람과 언론사를 확인한다.','다른 언론에서도 같은 내용을 보도했는지 찾아본다.','기사에 나온 자료의 출처를 확인한다.','제목만 읽고 내용을 판단한다.','작성 날짜가 최신인지 확인한다.'],a:3,ex:'자극적인 제목만 보고 판단하면 내용을 잘못 받아들이기 쉬워요.'}
 ],
 essay:{q:'시민이 정치에 참여하는 방법 두 가지를 쓰고, 각각 어떻게 참여하는 것인지 설명하시오.',model:'① 선거: 투표를 통해 나라나 지역의 대표를 직접 뽑는다.\n② 국민 청원·민원 제기: 정부나 지방 자치 단체에 의견이나 요구를 직접 전달한다.\n(그 밖에 시민 단체 활동, 공청회 참여, 서명 운동 등도 정답)',crit:['참여 방법 두 가지를 바르게 썼다 (각 2점, 4점)','각 방법을 알맞게 설명했다 (각 3점, 6점)']}},

{k:'수학',c:'lilac',st:'star',range:'예상 범위: 좌표평면과 그래프(정비례·반비례), 기본 도형과 작도, 평면·입체도형',
 qs:[
 {q:'점 (2a − 6, a + 1)이 y축 위에 있을 때, a의 값은?',ch:['−1','1','2','3','4'],a:3,ex:'y축 위의 점은 x좌표가 0이에요. 2a − 6 = 0 → a = 3.'},
 {q:'다음 중 정비례 관계 y = 3x의 그래프 위의 점은?',ch:['(1, −3)','(−2, −6)','(2, 5)','(3, 1)','(0, 3)'],a:1,ex:'x = −2를 대입하면 y = 3 × (−2) = −6이므로 (−2, −6)이 그래프 위에 있어요.'},
 {q:'반비례 관계 y = −6/x의 그래프에 대한 설명으로 옳은 것은?',ch:['원점을 지나는 직선이다.','제1사분면과 제3사분면을 지난다.','점 (2, 3)을 지난다.','제2사분면과 제4사분면을 지나는 한 쌍의 곡선이다.','x의 값이 커지면 y의 값은 항상 작아진다.'],a:3,ex:'a = −6 < 0이므로 제2, 4사분면을 지나는 한 쌍의 곡선이에요. 각 사분면에서 x가 커지면 y도 커져요.'},
 {q:'빈 물통에 1분에 4L씩 물을 넣을 때, 60L를 채우는 데 걸리는 시간은?',ch:['12분','15분','16분','20분','24분'],a:1,ex:'x분 후 물의 양 y = 4x. 60 = 4x → x = 15.'},
 {q:'넓이가 24cm²인 직사각형의 가로가 x cm, 세로가 y cm일 때, 가로가 6cm이면 세로는?',ch:['2cm','3cm','4cm','6cm','18cm'],a:2,ex:'xy = 24이므로 y = 24/x (반비례). x = 6이면 y = 4.'},
 {q:'평행한 두 직선 l, m이 다른 한 직선과 만나서 생기는 엇각 중 하나가 65°일 때, 다른 엇각의 크기는?',ch:['25°','65°','115°','130°','180°'],a:1,ex:'두 직선이 평행하면 엇각의 크기는 같아요.'},
 {q:'다음 중 두 삼각형이 합동이 되는 조건이 아닌 것은?',ch:['세 쌍의 대응변의 길이가 각각 같다.','두 쌍의 대응변의 길이가 각각 같고, 그 끼인각의 크기가 같다.','한 쌍의 대응변의 길이가 같고, 그 양 끝 각의 크기가 각각 같다.','세 쌍의 대응각의 크기가 각각 같다.'],a:3,ex:'세 각만 같으면 모양은 같아도 크기가 다를 수 있어요. 합동 조건은 SSS, SAS, ASA예요.'},
 {q:'한 원에서 부채꼴의 중심각에 대한 설명으로 옳지 않은 것은?',ch:['호의 길이는 중심각의 크기에 정비례한다.','부채꼴의 넓이는 중심각의 크기에 정비례한다.','중심각의 크기가 같으면 현의 길이도 같다.','현의 길이는 중심각의 크기에 정비례한다.','중심각의 크기가 같으면 호의 길이도 같다.'],a:3,ex:'현의 길이는 중심각에 정비례하지 않아요. 중심각이 2배여도 현은 2배보다 짧아요.'},
 {q:'반지름이 6cm, 중심각이 60°인 부채꼴의 넓이는?',ch:['3π cm²','6π cm²','12π cm²','18π cm²','36π cm²'],a:1,ex:'π × 6² × 60/360 = 36π × 1/6 = 6π cm².'}
 ],
 essay:{q:'반지름이 6cm인 반구의 부피와 겉넓이를 풀이 과정과 함께 구하시오.',model:'부피 = ½ × ⁴⁄₃ × π × 6³ = 144π (cm³)\n겉넓이 = 구 겉넓이의 절반 + 밑면(원) = ½ × 4π × 6² + π × 6² = 72π + 36π = 108π (cm²)',crit:['부피 식과 답(144π cm³) (5점)','겉넓이 식과 답(108π cm²), 밑면 포함 (5점)']}},

{k:'과학',c:'mint',st:'flower',range:'예상 범위: 기체의 성질(입자 운동, 보일·샤를 법칙), 태양계',
 qs:[
 {q:'다음 중 입자의 운동으로 설명하기 어려운 현상은?',ch:['젖은 빨래가 마른다.','물에 떨어뜨린 잉크가 퍼진다.','빵 굽는 냄새가 거실까지 퍼진다.','얼음이 물 위에 뜬다.','어항의 물이 조금씩 줄어든다.'],a:3,ex:'얼음이 뜨는 것은 얼음의 밀도가 물보다 작기 때문이에요. 나머지는 증발과 확산으로, 입자 운동 때문이에요.'},
 {q:'온도가 일정할 때 기체의 압력과 부피의 관계로 옳은 것은?',ch:['압력이 2배가 되면 부피도 2배가 된다.','압력이 2배가 되면 부피는 ½배가 된다.','압력과 관계없이 부피는 일정하다.','압력이 커지면 입자의 수가 줄어든다.','압력이 커지면 입자의 크기가 작아진다.'],a:1,ex:'보일 법칙: 압력과 부피는 반비례해요. 입자의 수와 크기는 변하지 않아요.'},
 {q:'온도가 일정할 때, 2기압에서 부피가 30mL인 기체의 압력을 1기압으로 낮추면 부피는?',ch:['15mL','30mL','45mL','60mL','90mL'],a:3,ex:'2 × 30 = 1 × V → V = 60mL.'},
 {q:'다음 중 샤를 법칙으로 설명할 수 있는 현상은?',ch:['높은 산에서 과자 봉지가 부푼다.','잠수부가 내뿜은 공기 방울이 위로 갈수록 커진다.','주사기 끝을 막고 피스톤을 누르면 부피가 줄어든다.','찌그러진 탁구공을 뜨거운 물에 넣으면 펴진다.','비행기 안에서 귀가 먹먹해진다.'],a:3,ex:'온도가 높아져 기체 부피가 커지는 현상이에요. 나머지는 압력 변화(보일 법칙)와 관련 있어요.'},
 {q:'압력이 일정할 때 기체의 온도를 낮추면 나타나는 변화로 옳은 것은?',ch:['입자 운동이 둔해지고 부피가 줄어든다.','입자 운동이 활발해지고 부피가 커진다.','입자의 수가 줄어든다.','입자의 크기가 작아진다.','부피는 변하지 않는다.'],a:0,ex:'온도가 낮아지면 입자 운동이 둔해지고 입자 사이 거리가 가까워져 부피가 줄어요.'},
 {q:'지구형 행성끼리만 짝지은 것은?',ch:['수성, 화성','목성, 토성','지구, 해왕성','금성, 천왕성','토성, 화성'],a:0,ex:'지구형 행성은 수성, 금성, 지구, 화성이에요.'},
 {q:'표면이 붉게 보이고, 극지방에 하얀 극관이 있으며, 과거에 물이 흘렀던 흔적이 있는 행성은?',ch:['수성','금성','화성','목성','천왕성'],a:2,ex:'화성은 표면의 산화철 때문에 붉게 보이고, 극관과 물이 흐른 자국이 발견됐어요.'},
 {q:'뚜렷하고 아름다운 고리가 있고, 평균 밀도가 물보다 작은 행성은?',ch:['지구','화성','목성','토성','수성'],a:3,ex:'토성은 뚜렷한 고리가 있고, 태양계 행성 중 평균 밀도가 가장 작아 물보다 작아요.'},
 {q:'태양 활동이 활발할 때 나타나는 현상으로 옳지 않은 것은?',ch:['흑점 수가 많아진다.','오로라가 자주 나타난다.','자기 폭풍이 생길 수 있다.','인공위성이 고장 날 수 있다.','흑점 수가 줄어든다.'],a:4,ex:'태양 활동이 활발할수록 흑점 수가 늘어나요.'}
 ],
 essay:{q:'잠수부가 물속에서 내뿜은 공기 방울은 수면으로 올라갈수록 커진다. 그 까닭을 \'압력\', \'입자\'라는 말을 사용하여 서술하시오.',model:'수면에 가까워질수록 공기 방울에 작용하는 물의 압력이 작아진다. 그래서 공기 방울 속 기체 입자 사이의 거리가 멀어져 부피가 커진다(보일 법칙). 이때 입자의 수와 크기는 변하지 않는다.',crit:['위로 갈수록 압력이 작아진다는 것을 썼다 (5점)','입자 사이 거리가 멀어져 부피가 커진다고 설명했다 (5점)']}},

{k:'영어',c:'peach',st:'heart',range:'예상 범위: 편지글 읽기, 감정·초대 대화, 최상급·미래·동명사',
 P:{E:'Dear Jake,\nHow are you? I\'m writing to tell you about my school festival. It was last Friday. My class made a small café. I made cookies with my friends, and they were sold out in an hour! The most popular food was sweet potato pizza. In the afternoon, we watched a dance show. It was the best part of the day. Next year, I\'m going to join the dance club. Please write back soon.\nYour friend, Mina'},
 qs:[
 {p:'E',q:'Mina가 편지를 쓴 목적으로 가장 알맞은 것은?',ch:['to invite Jake to her house','to tell Jake about her school festival','to ask Jake for a recipe','to say sorry to Jake','to sell cookies'],a:1,ex:'"I\'m writing to tell you about my school festival."에 목적이 나와 있어요.'},
 {p:'E',q:'윗글의 내용과 일치하지 않는 것은?',ch:['The festival was last Friday.','Mina made cookies with her friends.','The cookies were sold out in an hour.','The most popular food was cookies.','Mina is going to join the dance club.'],a:3,ex:'가장 인기 있던 음식은 sweet potato pizza였어요.'},
 {p:'E',q:'Mina가 꼽은 축제의 가장 좋았던 부분은?',ch:['making cookies','eating pizza','the dance show','the café','writing a letter'],a:2,ex:'"we watched a dance show. It was the best part of the day."'},
 {q:'빈칸에 알맞은 말은?\nSeoul is the ______ city in Korea. (big)',ch:['big','bigger','biggest','more big','most big'],a:2,ex:'최상급은 the + -est. big은 단모음 + 단자음이라 g를 하나 더 써서 biggest.'},
 {q:'"I\'m going to join the dance club."과 뜻이 가장 가까운 것은?',ch:['I joined the dance club.','I will join the dance club.','I am joining the dance club now.','I can\'t join the dance club.','I join the dance club every day.'],a:1,ex:'be going to와 will은 모두 미래를 나타내요.'},
 {q:'빈칸에 가장 알맞은 말은?\nYou ______ wear a helmet when you ride a bike.',ch:['should','didn\'t','wasn\'t','does','was'],a:0,ex:'should + 동사원형: "~해야 한다(충고)". 나머지는 뒤에 동사원형 wear와 어울리지 않아요.'},
 {q:'빈칸에 알맞은 말은?\nI enjoy ______ cookies.',ch:['make','to make','making','made','makes'],a:2,ex:'enjoy는 목적어로 동명사(-ing)를 써요.'},
 {q:'대화의 빈칸에 가장 알맞은 말은?\nA: What\'s wrong? You look sick.\nB: ______',ch:['I have a headache.','I\'m going to the park.','It\'s sunny today.','Thank you for the gift.','I like pizza.'],a:0,ex:'아파 보인다는 말에 증상을 말하는 답이 자연스러워요.'},
 {q:'대화의 빈칸에 가장 알맞은 말은?\nA: Would you like to come to my party?\nB: ______\nA: That\'s too bad.',ch:['Sure, I\'d love to.','Sorry, I can\'t. I have to study.','Yes, it is.','Here you are.','Good idea!'],a:1,ex:'A가 "That\'s too bad."라고 했으니 B는 초대를 거절했어요.'}
 ],
 essay:{q:'Mina에게 답장을 쓴다고 생각하고, ① 지난 주말에 한 일 두 문장(과거형)과 ② 다음 주 계획 한 문장(be going to)을 영어로 쓰시오.',model:'Last weekend, I went to the beach with my family.\nWe swam and ate fried chicken.\nNext week, I\'m going to visit my cousin.',crit:['과거형 두 문장을 바르게 썼다 (6점)','be going to로 계획 한 문장을 썼다 (4점)']}},

{k:'한문',c:'butter',st:'star',range:'예상 범위: 고사성어, 한문 격언, 한자의 짜임과 한자어',
 qs:[
 {q:'有備無患(유비무환)의 뜻으로 알맞은 것은?',ch:['미리 준비해 두면 걱정할 것이 없다.','근심이 있으면 병이 생긴다.','가진 것이 없으면 걱정도 없다.','준비하지 않아도 된다.','환자를 잘 돌보아야 한다.'],a:0,ex:'有(있을 유) 備(갖출 비) 無(없을 무) 患(근심 환): 준비가 있으면 근심이 없다.'},

(function(){const NUMS=/[①②③④⑤]/;
  function rng(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
  ROUNDS.forEach((L,ri)=>L.forEach(x=>x.qs.forEach((q,qi)=>{
    if(NUMS.test(q.ex)||q.ch.every(c=>/^[−\-\d(ㄱㄴㄷㄹ]/.test(c)))return;
    const r=rng(ri+x.k+qi), idx=q.ch.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    q.ch=idx.map(i=>q.ch[i]); q.a=idx.indexOf(q.a);
  })));})();

  :`<div class="q"><div class="qh">아직 모인 오답이 없어요. 시험을 풀고 채점하면 틀린 문제가 여기에 모여요.</div></div>`);}
function mcScore(x,r){return x.qs.reduce((s,q,i)=>s+(r.ans[i]===q.a?PT(i):0),0);}
function setMode(m){mode=m;try{localStorage.setItem(KEY+'-mode',m);}catch(e){}
  document.getElementById('taskView').hidden=m!=='task';document.getElementById('examView').hidden=m!=='exam';
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  if(m==='exam')renderExam();}
function renderExam(){
  if(exView==='wrong'){renderWrong();return;}
  document.getElementById('examView').innerHTML=exChips()+`<div class="exam-note">아직 1학년 시험범위가 공지되지 않아, 수행평가 주제와 1학년 교육과정으로 짐작한 예상 범위로 만든 연습 문제예요(1·2회 모두 예상 범위). 실제 범위가 나오면 그에 맞춘 회차를 추가해요. 과목마다 선택형 20문항(1~10번 4점, 11~20번 5점) + 서술형 2문항(각 5점) = 100점으로, 실제 시험의 90:10 배점과 같아요.</div>
  <div class="grid">${EXAMS().map((x,i)=>{const r=S.exam[ek(x.k)]&&exR(x.k);const answered=r?Object.keys(r.ans).length:0;
    return `<button class="ecard" data-ex="${i}" style="--tint:${tint(x.c)};--accent:${col(x.c)}">
      <span class="ecard-top"><h3>${x.k}</h3>${r&&r.best!=null?`<span class="stamp">${r.best}점</span>`:`<span class="tag">${answered?`푸는 중 ${answered}/${x.qs.length}`:'아직 안 풀었어요'}</span>`}</span>
      <span class="range">${x.range}</span><span class="meta">선택형 20 · 서술형 2 · 100점</span></button>`}).join('')}</div>`;
}
function openExam(i,keepScroll){
  openEx=i; openId=null; const x=EXAMS()[i], r=exR(x.k), g=r.graded; const sh=document.getElementById('sheet'); const top=keepScroll?sh.scrollTop:0;
  sh.style.setProperty('--tint',tint(x.c)); sh.style.setProperty('--accent',col(x.c));
  let prevP=null; const mc=mcScore(x,r), total=mc+selfSum(r), selfDone=r.selfs.every((v,ei)=>ei>=ESS(x).length||v!=null);
  const qs=x.qs.map((q,qi)=>{let h='';
    if(q.p&&q.p!==prevP){h+=`<div class="passage"><small>[${qi+1}${x.qs.slice(qi+1).some(z=>z.p===q.p)?'~'+(qi+1+x.qs.slice(qi+1).filter(z=>z.p===q.p).length):''}] 다음 글을 읽고 물음에 답하시오.</small>${esc(x.P[q.p])}</div>`;} prevP=q.p||prevP;
    const ok=r.ans[qi]===q.a;
    return h+`<div class="q ${g?(ok?'ok':'no'):''}"><div class="qh"><b>${qi+1}.</b>${esc(q.q)} <span class="pt">[${PT(qi)}점]</span></div>
      <div class="chs" role="group" aria-label="${qi+1}번 보기">${q.ch.map((c,ci)=>{const cls=g?(ci===q.a?'right':(r.ans[qi]===ci?'wrong':'')):'';
        return `<button data-q="${qi}" data-c="${ci}" aria-pressed="${r.ans[qi]===ci}" class="${cls}" ${g?'disabled':''}><span>${NUM[ci]}</span><span>${esc(c)}</span></button>`}).join('')}</div>
      ${g?`<div class="ex"><b>${ok?'맞았어요':'틀렸어요'}</b> 정답 ${NUM[q.a]} · ${esc(q.ex)}</div>`:''}</div>`;}).join('');
  const essay=ESS(x).map((e,ei)=>`<div class="q"><div class="qh"><b>서술형 ${ei+1}.</b>${esc(e.q)} <span class="pt">[5점]</span></div>
    <textarea id="es-${i}-${ei}" data-essay="${ei}" aria-label="서술형 ${ei+1} 답안">${esc(r.essays[ei])}</textarea>
    ${g?`<div class="model"><b>모범 답안</b>\n${esc(e.model)}</div><ul class="crit">${e.crit.map(c=>`<li>${esc(stripPt(c))}</li>`).join('')}</ul>
    <div class="selfg" role="group" aria-label="서술형 ${ei+1} 스스로 채점"><span>내 답안 채점:</span>${[5,3,0].map(v=>`<button data-self="${ei}:${v}" aria-pressed="${r.selfs[ei]===v}">${v===5?'다 맞음 5':v===3?'부분 3':'다시 0'}</button>`).join('')}</div>`:''}</div>`).join('');
  const n=Object.keys(r.ans).length;
  sh.innerHTML=`<div class="sheet-in">
    <div class="sheet-top"><div><div class="sub">모의시험 ${exRound}회 · ${esc(x.range)}</div><h2 id="sh-title">${x.k}</h2></div><button class="x" id="close" aria-label="닫기">✕</button></div>
    ${g?`<div class="scorebar"><b>${total}점</b><span>선택형 ${mc}/90</span><span>서술형 ${selfDone?selfSum(r)+'/10':'채점 전'}</span>${r.best!=null?`<span>최고 ${r.best}점</span>`:''}</div>`:''}
    ${qs}${essay}
    <div class="actions">${g?`<button class="big" id="retry">다시 풀기</button>`:`<span>푼 문제 ${n}/${x.qs.length}</span><button class="big" id="grade">채점하기</button>`}</div>
  </div>`;
  document.getElementById('scrim').hidden=false; sh.hidden=false; sh.scrollTop=top;
  if(!keepScroll)document.getElementById('close').focus();
}
function updBest(x,r){const t=mcScore(x,r)+selfSum(r); const prev=r.best; r.best=Math.max(r.best??0,t); return {t,prev};}

function dday(){
  const now=new Date(), t=new Date(2026,11,8);
  const d=Math.ceil((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  document.getElementById('dday').textContent=d>0?'D-'+d:d===0?'D-day':'끝!';
}
function render(){
  const chips=document.getElementById('chips');
  chips.innerHTML=['전체',...SUBJ.map(s=>s.k)].map(k=>`<button class="chip" aria-pressed="${k===filter}" data-f="${k}">${k}</button>`).join('');
  const all=SUBJ.flatMap(s=>s.items.map(it=>({s,it})));
  const done=all.filter(x=>S.status[x.it.id]===2);
  document.getElementById('cnt').textContent=`${done.length} / ${all.length}개`;
  document.getElementById('shelf').innerHTML=all.map(x=>S.status[x.it.id]===2?STICK[x.s.st](`var(--${x.s.c})`):'<span class="empty"></span>').join('');
  document.getElementById('grid').innerHTML=SUBJ.filter(s=>filter==='전체'||s.k===filter).map(s=>{
    const n=s.items.length, d=s.items.filter(i=>S.status[i.id]===2).length;
    return `<section class="subj" style="--tint:${tint(s.c)};--accent:${col(s.c)}">
      <div class="subj-head"><h3>${s.k}</h3><span class="tag">${s.exam?'시험 50 + 수행 50':'수행평가 100%'}</span></div>
      <div class="barbox"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${d}" aria-label="${s.k} 완료"><i style="width:${d/n*100}%"></i></div></div>
      <ul class="items">${s.items.map(it=>{const st=S.status[it.id]||0;
        return `<li><button class="item" data-id="${it.id}"><span class="dot s${st}">${st===2?STICK[s.st](col(s.c)):''}</span><span class="nm"><b>${it.t}</b><small>${it.form}${it.tpl?' · 연습장 있음':''}</small></span><span class="pct">${it.w}%</span></button></li>`}).join('')}</ul>
    </section>`}).join('');
}
function find(id){for(const s of SUBJ)for(const it of s.items)if(it.id===id)return{s,it};}
function openSheet(id){
  openId=id; const {s,it}=find(id); const st=S.status[id]||0; const steps=S.steps[id]||[]; const notes=S.notes[id]||{};
  const sh=document.getElementById('sheet');
  sh.style.setProperty('--tint',tint(s.c)); sh.style.setProperty('--accent',col(s.c));
  sh.innerHTML=`<div class="sheet-in">
    <div class="sheet-top"><div><div class="sub">${s.k} · ${it.form} · 성적 반영 ${it.w}%</div><h2 id="sh-title">${it.t}</h2></div><button class="x" id="close" aria-label="닫기">✕</button></div>
    <div class="status" role="group" aria-label="진행 상태">${['시작 전','준비 중','제출 완료'].map((l,i)=>`<button data-st="${i}" aria-pressed="${st===i}">${l}</button>`).join('')}</div>
    ${it.tip?`<div class="tip"><b>꿀팁</b>${it.tip}</div>`:''}
    <div class="box"><h3>이렇게 준비해요</h3><ul class="steps">${it.steps.map((t,i)=>`<li><label><input type="checkbox" id="stp-${id}-${i}" data-i="${i}" ${steps[i]?'checked':''}><span>${t}</span></label></li>`).join('')}</ul></div>
    ${it.tpl?`<div class="box"><h3>글쓰기 연습장</h3><div style="font-size:13px;color:var(--soft)">칸마다 짧게라도 써 보면 실제 평가 때 훨씬 수월해요.</div>
      ${it.tpl.map((p,i)=>`<div class="note-sec"><label for="nt-${id}-${i}">${p[0]}</label>${p[1]?`<small>${p[1]}</small>`:''}<textarea id="nt-${id}-${i}" data-i="${i}">${(notes[i]||'').replace(/</g,'&lt;')}</textarea></div>`).join('')}
      <div class="wc"><span id="wc"></span><span id="sv" class="saved"></span></div></div>`:''}
  </div>`;
  document.getElementById('scrim').hidden=false; sh.hidden=false; sh.scrollTop=0;
  updWc(); document.getElementById('close').focus();
}
function updWc(){const el=document.getElementById('wc'); if(!el)return;
  const n=Object.values(S.notes[openId]||{}).join('').replace(/\s/g,'').length; el.textContent=`공백 빼고 ${n}자`;}
function closeSheet(){document.getElementById('sheet').hidden=true;document.getElementById('scrim').hidden=true;
  const b=openId!=null?document.querySelector(`.item[data-id="${openId}"]`):document.querySelector(`.ecard[data-ex="${openEx}"]`);
  if(openEx!=null)renderExam(); openId=null; openEx=null;
  const b2=b&&b.dataset.ex!=null?document.querySelector(`.ecard[data-ex="${b.dataset.ex}"]`):b; if(b2)b2.focus();}
function cheer(s){const c=document.getElementById('cheer'); c.innerHTML=STICK[s.st](col(s.c)); c.classList.add('on'); setTimeout(()=>c.classList.remove('on'),900);}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(f){filter=f.dataset.f;render();return;}
  const it=e.target.closest('.item'); if(it){openEx=null;openSheet(it.dataset.id);return;}
  if(e.target.closest('#close')||e.target.id==='scrim'){closeSheet();return;}
  const md=e.target.closest('[data-mode]'); if(md){setMode(md.dataset.mode);return;}
  const rb=e.target.closest('[data-round]'); if(rb){if(rb.dataset.round==='wrong'){exView='wrong';}else{exView='round';exRound=+rb.dataset.round;try{localStorage.setItem(KEY+'-round',exRound);}catch(e){}} renderExam();return;}
  const ec=e.target.closest('[data-ex]'); if(ec){openExam(+ec.dataset.ex);return;}
  if(openEx!=null){const x=EXAMS()[openEx], r=exR(x.k);
    const ch=e.target.closest('[data-c]'); if(ch&&!r.graded){r.ans[+ch.dataset.q]=+ch.dataset.c; save(); openExam(openEx,true); return;}
    if(e.target.closest('#grade')){r.graded=true; r.selfs=[null,null]; const {t}=updBest(x,r); save(); openExam(openEx); document.getElementById('sheet').scrollTop=0; if(t>=80)cheer(x); return;}
    const sg=e.target.closest('[data-self]'); if(sg){const [ei,v]=sg.dataset.self.split(':').map(Number); r.selfs[ei]=v; const {t,prev}=updBest(x,r); save(); openExam(openEx,true); if(t>=80&&(prev??0)<80)cheer(x); return;}
    if(e.target.closest('#retry')){r.ans={}; r.essays=['','']; r.graded=false; r.selfs=[null,null]; save(); openExam(openEx); return;}
  }
  const st=e.target.closest('[data-st]'); if(st&&openId){const v=+st.dataset.st; const prev=S.status[openId]||0; S.status[openId]=v; save();
    document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.st===v)); render();
    if(v===2&&prev!==2) cheer(find(openId).s);}
});
document.addEventListener('change',e=>{
  if(e.target.matches('.steps input')&&openId){const a=S.steps[openId]||[]; a[+e.target.dataset.i]=e.target.checked; S.steps[openId]=a;
    if(e.target.checked&&!(S.status[openId]>0)){S.status[openId]=1; document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st==='1'));}
    save(); render();}
});
let tmr;
document.addEventListener('input',e=>{
  if(e.target.matches('[data-essay]')&&openEx!=null){exR(EXAMS()[openEx].k).essays[+e.target.dataset.essay]=e.target.value; clearTimeout(tmr); tmr=setTimeout(save,400); return;}
  if(e.target.matches('.note-sec textarea')&&openId){const o=S.notes[openId]||{}; o[+e.target.dataset.i]=e.target.value; S.notes[openId]=o; updWc();
    const sv=document.getElementById('sv'); sv.textContent=''; clearTimeout(tmr); tmr=setTimeout(()=>{save(); sv.textContent='저장됨';},500);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(openId||openEx!=null))closeSheet();});
dday(); render(); setMode(mode==='exam'?'exam':'task');
</script>

</body></html>
